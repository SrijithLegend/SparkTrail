name: Fleet depot - mass max-power across 20 DC chargers
ambient_C: 40
run_s: 600
target: { type: charger_dcfast, limits: { normal_A: 125, max_A: 250 } }
hub:    { grid_type: depot, chargers: 20, transformer_kVA: 1500, impedance_pu: 0.05 }
attacks:
  - { id: A-MASS, entry_point: cyber.hub_controller, mechanism: mass_command, field: charging_profile.limit_A, to: 250, start_s: 30 }
  - { id: A-SHED, entry_point: cyber.hub_controller, mechanism: dos_blackhole, field: hub.load_shed, start_s: 30 }
