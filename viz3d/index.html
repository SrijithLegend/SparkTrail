<title>SparkTrail Tracer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed dark 3D stage, floating HUD panels (top scene bar, right trace rail, bottom scrubber) */
:root{
  --bg:#0a0e14; --panel:#121823; --panel-edge:#1e2a3a; --fg:#e8eef6; --muted:#8294ad;
  --accent:#36d4ff;            /* attack / electrical */
  --heat-cool:#3a7bd5; --heat-mid:#ffb43a; --heat-hot:#ff3b30;
  --good:#39d98a; --warn:#ffb43a; --crit:#ff3b30;
  --font:'Space Grotesk',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root[data-theme="light"]{
  --bg:#0a0e14; --panel:#121823; --panel-edge:#1e2a3a; --fg:#e8eef6; --muted:#8294ad;
}
/* SparkTrail is a single committed dark instrument look (a glowing simulation stage); same palette both themes by design */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;z-index:5}

/* top bar */
#top{top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:14px;align-items:center;
  padding:14px max(16px,env(safe-area-inset-right,0)) 14px max(16px,env(safe-area-inset-left,0));
  background:linear-gradient(#0a0e14ee,#0a0e1400)}
#top h1{font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
#top h1 b{color:var(--accent)}
#top .sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
select{background:var(--panel);color:var(--fg);border:1px solid var(--panel-edge);border-radius:8px;
  padding:7px 10px;font-family:var(--font);font-size:12px;margin-left:auto;max-width:52vw}

/* right trace rail */
#rail{top:72px;right:max(12px,env(safe-area-inset-right,0));width:300px;max-width:calc(100vw - 24px);
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 180px);overflow:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#0d131d;border:1px solid var(--panel-edge);border-radius:10px;padding:9px 10px}
.tile .k{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tile .v{font-size:19px;font-family:var(--mono);margin-top:3px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:11px;color:var(--muted)}
.sec-h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trace{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11px}
.row{display:flex;gap:8px;align-items:baseline;padding:5px 7px;border-radius:7px;background:#0d131d;
  border-left:3px solid var(--panel-edge)}
.row.attack{border-left-color:var(--accent)}
.row.alert{border-left-color:var(--warn)}
.row.physics{border-left-color:var(--heat-hot)}
.row .t{color:var(--muted);min-width:42px}
.row .m{flex:1;min-width:0;word-break:break-word}
.flag{font-size:9px;padding:1px 5px;border-radius:5px;letter-spacing:.05em;text-transform:uppercase}
.flag.modelled{background:#15351f;color:var(--good)}
.flag.illustrative{background:#3a2a10;color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}

/* bottom scrubber */
#dock{left:0;right:0;bottom:env(safe-area-inset-bottom,0);
  padding:14px max(16px,env(safe-area-inset-right,0)) 16px max(16px,env(safe-area-inset-left,0));
  background:linear-gradient(#0a0e1400,#0a0e14ee 40%)}
.scrub{display:flex;gap:12px;align-items:center;max-width:720px}
button.play{background:var(--accent);color:#04121a;border:0;border-radius:50%;width:42px;height:42px;
  font-size:16px;cursor:pointer;flex:none}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:4px}
.clock{font-family:var(--mono);font-size:13px;min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
.banner{position:fixed;inset:auto 0 0 0;z-index:9;text-align:center;font-size:12px;color:var(--muted);
  padding:8px;background:#0a0e14}
@media(max-width:560px){
  #rail{position:fixed;top:auto;bottom:96px;left:max(12px,env(safe-area-inset-left,0));right:max(12px,env(safe-area-inset-right,0));width:auto;max-height:38%}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div class="hud" id="top">
  <div>
    <h1><b>Spark</b>Trail · Tracer</h1>
    <div class="sub" id="scene-name">loading…</div>
  </div>
  <select id="scene-select"></select>
</div>

<div class="hud" id="rail">
  <div class="tiles" id="tiles"></div>
  <div class="sec-h">Propagation trace</div>
  <div class="trace" id="trace"></div>
  <div class="sec-h">Legend</div>
  <div class="legend">
    <span><i style="background:var(--accent)"></i>attack / signal</span>
    <span><i style="background:var(--heat-hot)"></i>pack heat</span>
    <span><i style="background:var(--warn)"></i>monitor alert</span>
    <span><span class="flag modelled">modelled</span> real model</span>
    <span><span class="flag illustrative">illustrative</span> hand-set</span>
  </div>
</div>

<div class="hud" id="dock">
  <div class="scrub">
    <button class="play" id="play">▶</button>
    <input type="range" id="range" min="0" max="100" value="0">
    <div class="clock" id="clock">0s</div>
  </div>
</div>

<div class="banner" id="banner" hidden></div>

<script>
const $ = s => document.querySelector(s);
let SCENES = [], scene3d, cam, renderer, nodes = {}, tubes = [], pulses = [];
let cur = null, playing = true, tIdx = 0;

// ---------- data load ----------
async function boot(){
  try{
    const r = await fetch('./scenes.json'); SCENES = await r.json();
  }catch(e){
    $('#banner').hidden = false;
    $('#banner').textContent = 'Could not load scenes.json — serve this page from the same folder as scenes.json.';
    return;
  }
  const sel = $('#scene-select');
  SCENES.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=s.name; sel.appendChild(o); });
  sel.onchange = ()=> loadScene(+sel.value);
  initGL();
  loadScene(0);
  animate();
}

// ---------- three.js scene ----------
function initGL(){
  scene3d = new THREE.Scene();
  scene3d.fog = new THREE.FogExp2(0x0a0e14, 0.035);
  cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  scene3d.add(new THREE.AmbientLight(0x4a6a8a, 0.6));
  const key = new THREE.PointLight(0x9fd8ff, 0.8, 50); key.position.set(6,10,6); scene3d.add(key);
  // ground grid
  const grid = new THREE.GridHelper(40, 40, 0x1e2a3a, 0x141c28);
  grid.position.y = -1.6; scene3d.add(grid);
  addEventListener('resize', ()=>{
    cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  installOrbit();
}

// minimal orbit: drag to rotate, wheel to zoom, gentle auto-spin when idle
let orb = {az:0.7, el:0.5, r:16, idle:0, drag:false, px:0, py:0};
function installOrbit(){
  const c = renderer.domElement;
  c.addEventListener('pointerdown', e=>{orb.drag=true; orb.px=e.clientX; orb.py=e.clientY; orb.idle=0;});
  addEventListener('pointerup', ()=>orb.drag=false);
  addEventListener('pointermove', e=>{
    if(!orb.drag) return; orb.idle=0;
    orb.az -= (e.clientX-orb.px)*0.006; orb.el += (e.clientY-orb.py)*0.006;
    orb.el = Math.max(0.1, Math.min(1.3, orb.el)); orb.px=e.clientX; orb.py=e.clientY;
  });
  c.addEventListener('wheel', e=>{orb.r = Math.max(7, Math.min(30, orb.r + e.deltaY*0.01)); e.preventDefault();}, {passive:false});
}
function updateCam(dt){
  orb.idle += dt;
  if(!orb.drag && orb.idle>2.5) orb.az += dt*0.08;      // gentle default orbit
  const r=orb.r, e=orb.el;
  cam.position.set(Math.cos(orb.az)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(orb.az)*Math.cos(e)*r);
  cam.lookAt(0,0.3,0);
}

function clearScene(){
  Object.values(nodes).forEach(n=>scene3d.remove(n.group));
  tubes.forEach(t=>scene3d.remove(t)); pulses.forEach(p=>scene3d.remove(p.mesh));
  nodes={}; tubes=[]; pulses=[];
}

function makeLabel(text){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=64;
  const g=cv.getContext('2d'); g.fillStyle='#e8eef6'; g.font='28px monospace'; g.textAlign='center';
  g.fillText(text,128,40);
  const tex=new THREE.CanvasTexture(cv); const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  sp.scale.set(2.4,0.6,1); return sp;
}

function node(name, geo, color, pos){
  const group=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.25, roughness:0.4, metalness:0.3});
  const mesh=new THREE.Mesh(geo, mat); group.add(mesh);
  const lbl=makeLabel(name); lbl.position.set(0, 1.4, 0); group.add(lbl);
  group.position.set(...pos); scene3d.add(group);
  nodes[name]={group, mesh, mat, pos:new THREE.Vector3(...pos)};
}

function tube(a, b){
  const curve=new THREE.LineCurve3(a.clone(), b.clone());
  const g=new THREE.TubeGeometry(curve, 1, 0.04, 8, false);
  const m=new THREE.MeshStandardMaterial({color:0x1e2a3a, emissive:0x1e2a3a, emissiveIntensity:0.3});
  const t=new THREE.Mesh(g,m); scene3d.add(t); tubes.push(t); return {a,b};
}

function buildScene(s){
  clearScene();
  const chargers = s.chargers;
  node('backend', new THREE.BoxGeometry(1,1.6,0.8), 0x2a3a52, [-6,0,0]);
  node('hub_tx', new THREE.BoxGeometry(1.4,1.4,1.4), 0x3a4a62, [0,0,0]);
  tube(nodes['backend'].pos, nodes['hub_tx'].pos);
  const n=chargers.length, R=Math.max(3, n*0.5);
  chargers.forEach((cn,i)=>{
    const ang = n===1 ? 0 : (i/(n-1)-0.5)*Math.PI*0.9;
    const pos=[Math.cos(ang)*R+4, 0, Math.sin(ang)*R];
    node(cn, new THREE.CylinderGeometry(0.35,0.4,1.8,12), 0x2a4a3a, pos);
    tube(nodes['hub_tx'].pos, nodes[cn].pos);
  });
  // reset camera distance to fit
  orb.r = Math.max(14, 9 + n*0.6);
}

// heat ramp blue -> amber -> red over 35..60 C
function heatColor(T){
  const x=Math.max(0,Math.min(1,(T-35)/(58-35)));
  const c=new THREE.Color();
  if(x<0.5) c.lerpColors(new THREE.Color(0x3a7bd5), new THREE.Color(0xffb43a), x*2);
  else c.lerpColors(new THREE.Color(0xffb43a), new THREE.Color(0xff3b30), (x-0.5)*2);
  return c;
}

function spawnPulse(from, to){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,12),
    new THREE.MeshBasicMaterial({color:0x36d4ff}));
  scene3d.add(m); pulses.push({mesh:m, from:nodes[from].pos, to:nodes[to].pos, u:0});
}

// ---------- scene state at a timeline index ----------
function applyFrame(){
  if(!cur) return;
  const fr = cur.timeline[tIdx]; if(!fr) return;
  // charger heat
  cur.chargers.forEach(cn=>{
    const st=fr.chargers[cn]; if(!st||!nodes[cn]) return;
    const col=heatColor(st.temp);
    nodes[cn].mat.color.copy(col); nodes[cn].mat.emissive.copy(col);
    nodes[cn].mat.emissiveIntensity = 0.25 + 0.9*Math.max(0,(st.temp-40)/18);
  });
  // transformer overload pulse
  const hub=nodes['hub_tx'];
  if(hub){
    const over=Math.max(0,(fr.load-100)/80);
    const c=new THREE.Color(0x3a4a62).lerp(new THREE.Color(0xff3b30), Math.min(1,over));
    hub.mat.color.copy(c); hub.mat.emissive.copy(c);
    hub.mat.emissiveIntensity = 0.25 + over*0.8;
  }
  // markers that just became active -> spawn pulses + log
  renderPanel(fr);
}

function markerSource(m){
  if(m.node && m.node.includes('backend')) return 'backend';
  if(m.node && m.node.includes('hub')) return 'hub_tx';
  return 'hub_tx';
}
function markerTarget(){ return cur.chargers[0]; }

let lastT=-1;
function fireMarkers(t){
  cur.markers.forEach(m=>{
    if(m.t<=t && m.t>lastT){
      spawnPulse(markerSource(m), markerTarget());
    }
  });
  lastT=t;
}

// ---------- panel ----------
function renderPanel(fr){
  const sc=cur.score;
  $('#tiles').innerHTML = tile('Impact', sc.impact_score) +
    tile('Peak pack', sc.peak_pack_temp_C, '°C') +
    tile('Transformer', sc.peak_transformer_load_pct, '%') +
    tile('Detect Δ', sc.detection_delay_s==null?'—':sc.detection_delay_s, 's');
  const t=fr.t;
  const shown = cur.markers.filter(m=>m.t<=t).slice(-6).reverse();
  let rows = shown.map(m=>row(m.type, m.t, `${m.node} · ${m.label}`,
    m.type==='attack'?'illustrative':'modelled')).join('');
  // live physics line for charger 0
  const c0=fr.chargers[cur.chargers[0]];
  if(c0){
    const spoof = Math.abs(c0.reported-c0.temp)>1;
    rows = row('physics', t, `${cur.chargers[0]} true ${c0.temp}°C @ ${c0.current}A`,'modelled') +
      (spoof?row('attack', t, `reported ${c0.reported}°C (spoofed)`,'illustrative'):'') + rows;
  }
  $('#trace').innerHTML = rows || '<div class="row"><span class="m">no events yet</span></div>';
}
const tile=(k,v,u='')=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}${u?` <small>${u}</small>`:''}</div></div>`;
const row=(cls,t,m,flag)=>`<div class="row ${cls}"><span class="t">${t|0}s</span><span class="m">${m}</span><span class="flag ${flag}">${flag}</span></div>`;

// ---------- loop ----------
function loadScene(i){
  cur = SCENES[i]; tIdx=0; lastT=-1;
  $('#scene-name').textContent = cur.name;
  $('#range').max = cur.timeline.length-1;
  buildScene(cur); applyFrame();
}
$('#play').onclick = ()=>{ playing=!playing; $('#play').textContent = playing?'❚❚':'▶'; };
$('#play').textContent='❚❚';
$('#range').oninput = e=>{ playing=false; $('#play').textContent='▶'; tIdx=+e.target.value; lastT=cur.timeline[tIdx].t; applyFrame(); updateClock(); };
function updateClock(){ $('#clock').textContent = Math.round(cur.timeline[tIdx].t)+'s'; }

let last=performance.now(), acc=0;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=(now-last)/1000; last=now;
  updateCam(dt);
  if(cur){
    if(playing){
      acc+=dt;
      if(acc>0.06){ acc=0; tIdx=Math.min(tIdx+1, cur.timeline.length-1);
        $('#range').value=tIdx; updateClock();
        if(tIdx>=cur.timeline.length-1){ playing=false; $('#play').textContent='▶'; }
        fireMarkers(cur.timeline[tIdx].t); applyFrame();
      }
    }
    // advance pulses
    for(let i=pulses.length-1;i>=0;i--){
      const p=pulses[i]; p.u+=dt*0.9;
      if(p.u>=1){ scene3d.remove(p.mesh); pulses.splice(i,1); continue; }
      p.mesh.position.lerpVectors(p.from,p.to,p.u);
      p.mesh.material.color.setHSL(0.53, 1, 0.5+0.2*Math.sin(p.u*10));
    }
  }
  renderer.render(scene3d, cam);
}
boot();
</script>
