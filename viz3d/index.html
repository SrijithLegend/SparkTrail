<title>SparkTrail Tracer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Retro CRT reskin (ref: Blender beige Compaq render) — amber phosphor on a warm-dark tube,
   scanlines + vignette + screen curvature, framed by a beige monitor bezel. Same 3D sim underneath. */
:root{
  --bg0:#0a0803; --bg1:#141009; --glass:rgba(24,19,9,.80); --edge:#4a3a1c; --edge2:#6b5225;
  --fg:#ffcf7a; --muted:#b08a4a;                /* amber phosphor */
  --accent:#ffb000; --accent2:#ff7a1a;          /* signal / attack (amber/orange) */
  --heat-cool:#4a90d9; --heat-mid:#f59e0b; --heat-hot:#ff3b30;
  --good:#7dff8a; --warn:#ffb000; --crit:#ff3b30;
  --bezel:#cdbf9a; --bezel2:#a89669;            /* beige plastic case */
  --font:'VT323',ui-monospace,monospace; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root[data-theme="light"]{ color-scheme:dark }
html,body{height:100%}
body{margin:0;background:
    radial-gradient(1200px 820px at 50% 40%, #1c1608 0%, #0a0803 70%),
    var(--bg0);
  color:var(--fg);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0}

/* --- CRT overlays (purely decorative, never intercept input) --- */
#crt{position:fixed;inset:0;z-index:50;pointer-events:none}
#crt::before{content:"";position:absolute;inset:0;                 /* scanlines */
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55}
#crt::after{content:"";position:absolute;inset:0;                  /* curvature + vignette + phosphor tint */
  background:radial-gradient(130% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%),
             radial-gradient(100% 100% at 50% 50%,rgba(255,176,0,.05),transparent 60%);
  box-shadow:inset 0 0 160px rgba(0,0,0,.7)}
#flick{position:fixed;inset:0;z-index:51;pointer-events:none;background:rgba(255,176,0,.015);
  animation:flick .12s steps(2) infinite}
@keyframes flick{0%{opacity:.9}50%{opacity:1}100%{opacity:.92}}
/* beige monitor bezel framing the whole tube */
#bezel{position:fixed;inset:0;z-index:49;pointer-events:none;border-radius:26px;
  box-shadow:inset 0 0 0 12px var(--bezel),inset 0 0 0 16px var(--bezel2),
             inset 0 0 44px 16px rgba(0,0,0,.6)}
@media(prefers-reduced-motion:reduce){#flick{display:none}}

.hud{position:fixed;z-index:5;text-shadow:0 0 6px rgba(255,176,0,.35)}
.glass{background:var(--glass);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid var(--edge);border-radius:4px}

/* top bar */
#top{top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:12px max(16px,env(safe-area-inset-right,0)) 12px max(16px,env(safe-area-inset-left,0))}
.brand{display:flex;flex-direction:column;gap:1px}
.brand h1{font-family:var(--font);font-size:22px;margin:0;letter-spacing:.10em;text-transform:uppercase;font-weight:400;line-height:1}
.brand h1 b{color:var(--accent)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:13px;letter-spacing:.04em;padding:2px 8px;border-radius:3px;border:1px solid var(--edge2);
  color:var(--muted);background:#16110880}
.badge b{color:var(--fg);font-weight:400}
select{background:#160f06;color:var(--fg);border:1px solid var(--edge2);border-radius:3px;
  padding:6px 10px;font-family:var(--font);font-size:16px;margin-left:auto;max-width:56vw}

/* right trace rail */
#rail{top:62px;right:max(12px,env(safe-area-inset-right,0));width:306px;max-width:calc(100vw - 24px);
  padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 168px);overflow:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#14100780;border:1px solid var(--edge);border-radius:3px;padding:9px 10px;position:relative;overflow:hidden}
.tile .k{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.tile .v{font-size:19px;font-family:var(--mono);margin-top:3px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:11px;color:var(--muted)}
.tile.hot{border-color:#7a2a1a}.tile.warn{border-color:#7a5a1a}
.gauge{height:4px;border-radius:2px;background:#2a2010;margin-top:7px;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.sec-h{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.trace{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11px}
.row{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:2px;background:#14100780;
  border-left:3px solid var(--edge2)}
.row.attack{border-left-color:var(--accent)}
.row.alert{border-left-color:var(--warn)}
.row.physics{border-left-color:var(--heat-hot)}
.row .t{color:var(--muted);min-width:40px}
.row .m{flex:1;min-width:0;word-break:break-word}
.flag{font-size:9px;padding:1px 5px;border-radius:5px;letter-spacing:.04em;text-transform:uppercase}
.flag.modelled{background:#17330f;color:var(--good)}
.flag.illustrative{background:#3a2a10;color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}

/* selected-node chip */
#sel{left:max(16px,env(safe-area-inset-left,0));bottom:96px;padding:10px 12px;font-size:12px;max-width:260px}
#sel .n{font-weight:600;letter-spacing:.02em}
#sel .s{font-family:var(--mono);color:var(--muted);margin-top:4px;font-size:11px;line-height:1.5}

/* bottom transport */
#dock{left:0;right:0;bottom:env(safe-area-inset-bottom,0);
  padding:12px max(16px,env(safe-area-inset-right,0)) 16px max(16px,env(safe-area-inset-left,0))}
.transport{display:flex;gap:10px;align-items:center;max-width:860px;margin:0 auto}
button.ctl{background:linear-gradient(#efe6cf,#cdbf9a);color:#2a2008;border:1px solid #9a875a;border-radius:4px;height:40px;
  min-width:40px;padding:0 10px;font-size:15px;cursor:pointer;flex:none;font-family:var(--mono);
  box-shadow:inset 0 1px 0 #fff8e6,0 1px 2px rgba(0,0,0,.5)}
button.play{background:linear-gradient(#ffd27a,#ffb000);color:#2a1800;border:1px solid #9a6a10;width:46px;height:46px;
  border-radius:50%;font-size:16px}
button.ctl:hover{filter:brightness(1.08)}
button.ctl:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:5px}
.clock{font-family:var(--mono);font-size:13px;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.spd{font-family:var(--mono);font-size:12px}
.banner{position:fixed;inset:auto 0 0 0;z-index:9;text-align:center;font-size:14px;color:var(--muted);padding:10px;background:#0a0803}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0) + 56px);z-index:4;
  font-size:14px;color:var(--muted);background:#160f06cc;border:1px solid var(--edge);border-radius:3px;padding:4px 12px;
  transition:opacity .6s;pointer-events:none}
@media(max-width:620px){
  #rail{position:fixed;top:auto;bottom:150px;left:max(12px,env(safe-area-inset-left,0));right:max(12px,env(safe-area-inset-right,0));width:auto;max-height:34%}
  #sel{display:none}
  .transport{flex-wrap:wrap;justify-content:center}
  select{max-width:100%}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div id="bezel"></div>
<div id="crt"></div>
<div id="flick"></div>

<div class="hud" id="top">
  <div class="brand">
    <h1><b>Spark</b>Trail · Tracer</h1>
    <div class="badges" id="badges"></div>
  </div>
  <select id="scene-select"></select>
</div>

<div class="hint" id="hint">drag to orbit · scroll to zoom · click a node to focus</div>

<div class="hud glass" id="rail">
  <div class="tiles" id="tiles"></div>
  <div class="sec-h">Propagation trace</div>
  <div class="trace" id="trace"></div>
  <div class="sec-h">Legend</div>
  <div class="legend">
    <span><i style="background:var(--accent)"></i>attack / signal</span>
    <span><i style="background:var(--heat-hot)"></i>pack heat</span>
    <span><i style="background:var(--warn)"></i>alert</span>
    <span><span class="flag modelled">modelled</span></span>
    <span><span class="flag illustrative">illustrative</span></span>
  </div>
</div>

<div class="hud glass" id="sel" hidden><div class="n" id="sel-n"></div><div class="s" id="sel-s"></div></div>

<div class="hud" id="dock">
  <div class="transport">
    <button class="ctl" id="reset" title="Reset view">⟲</button>
    <button class="ctl" id="back" title="Step back">⏮</button>
    <button class="ctl play" id="play">❚❚</button>
    <button class="ctl" id="fwd" title="Step forward">⏭</button>
    <input type="range" id="range" min="0" max="100" value="0">
    <button class="ctl spd" id="speed" title="Playback speed">1×</button>
    <div class="clock" id="clock">0s</div>
  </div>
</div>

<div class="banner" id="banner" hidden></div>

<script>
const $=s=>document.querySelector(s);
let SCENES=[], scene3d, cam, renderer, raycaster, nodes={}, tubes=[], pulses=[], glows=[];
let cur=null, playing=true, tIdx=0, selected=null;
const SPEEDS=[0.5,1,2,4]; let spdI=1;

async function boot(){
  try{ SCENES=await (await fetch('./scenes.json')).json(); }
  catch(e){ $('#banner').hidden=false; $('#banner').textContent='Could not load scenes.json — serve this page from the same folder as scenes.json.'; return; }
  const sel=$('#scene-select');
  SCENES.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;sel.appendChild(o);});
  sel.onchange=()=>loadScene(+sel.value);
  initGL(); loadScene(0); animate();
  setTimeout(()=>{$('#hint').style.opacity='0';},5000);
}

// ---------- GL ----------
function initGL(){
  scene3d=new THREE.Scene();
  scene3d.fog=new THREE.FogExp2(0x0a0803,0.028);
  cam=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  scene3d.add(new THREE.AmbientLight(0xb08a4a,0.75));
  const key=new THREE.PointLight(0xffcf8a,1.1,80); key.position.set(8,14,8); scene3d.add(key);
  const rim=new THREE.PointLight(0xff7a1a,0.45,80); rim.position.set(-10,6,-6); scene3d.add(rim);
  const grid=new THREE.GridHelper(60,60,0x4a3a1c,0x241a0a); grid.position.y=-1.7; scene3d.add(grid);
  raycaster=new THREE.Raycaster();
  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  installOrbit();
}

// orbit around a pivot; click-to-focus moves the pivot
let orb={az:0.75,el:0.5,r:18,idle:0,drag:false,px:0,py:0,moved:0,
  pivot:new THREE.Vector3(0,.3,0), tgt:new THREE.Vector3(0,.3,0), tr:18};
function installOrbit(){
  const c=renderer.domElement;
  c.addEventListener('pointerdown',e=>{orb.drag=true;orb.px=e.clientX;orb.py=e.clientY;orb.idle=0;orb.moved=0;});
  addEventListener('pointerup',e=>{ if(orb.drag && orb.moved<5) pick(e); orb.drag=false; });
  addEventListener('pointermove',e=>{ if(!orb.drag)return; orb.idle=0;
    orb.moved+=Math.abs(e.clientX-orb.px)+Math.abs(e.clientY-orb.py);
    orb.az-=(e.clientX-orb.px)*0.006; orb.el+=(e.clientY-orb.py)*0.006;
    orb.el=Math.max(0.12,Math.min(1.35,orb.el)); orb.px=e.clientX; orb.py=e.clientY; });
  c.addEventListener('wheel',e=>{orb.tr=Math.max(6,Math.min(44,orb.tr+e.deltaY*0.012));e.preventDefault();},{passive:false});
}
function pick(e){
  const m=new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m,cam);
  const meshes=Object.values(nodes).map(n=>n.mesh);
  const hit=raycaster.intersectObjects(meshes,false)[0];
  if(hit){ const name=Object.keys(nodes).find(k=>nodes[k].mesh===hit.object); focusNode(name); }
}
function focusNode(name){
  selected=name; const n=nodes[name];
  orb.tgt.copy(n.pos); orb.tr=Math.max(7, n.focus||9);
  applyFrame();
}
function resetView(){ selected=null; orb.tgt.set(0,.3,0); orb.tr=cur._overview; $('#sel').hidden=true; }
function updateCam(dt){
  orb.idle+=dt;
  if(!orb.drag && orb.idle>3 && !selected) orb.az+=dt*0.06;
  orb.pivot.lerp(orb.tgt, Math.min(1,dt*3)); orb.r+=(orb.tr-orb.r)*Math.min(1,dt*3);
  const r=orb.r,e=orb.el,p=orb.pivot;
  cam.position.set(p.x+Math.cos(orb.az)*Math.cos(e)*r, p.y+Math.sin(e)*r, p.z+Math.sin(orb.az)*Math.cos(e)*r);
  cam.lookAt(p);
}

// ---------- helpers ----------
function sprite(text,scale=2.4){
  const cv=document.createElement('canvas'); cv.width=256;cv.height=64;
  const g=cv.getContext('2d'); g.fillStyle='#ffcf7a'; g.shadowColor='#ffb000'; g.shadowBlur=8;
  g.font='34px "VT323",monospace'; g.textAlign='center'; g.fillText(text,128,44);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));
  sp.scale.set(scale,scale*0.25,1); return sp;
}
function glowSprite(){
  const cv=document.createElement('canvas'); cv.width=128;cv.height=128;
  const g=cv.getContext('2d'); const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,0.9)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  return new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
}
function addGlow(pos,color,size){
  const s=glowSprite(); s.material.color.set(color); s.scale.set(size,size,1); s.position.copy(pos); s.position.y+=.2;
  scene3d.add(s); glows.push({sp:s,base:size}); return s;
}

// charger geometry per type (keeps types visually distinct)
function chargerGeo(kind){
  if(kind.includes('AC Level 1')) return new THREE.BoxGeometry(0.5,1.0,0.3);
  if(kind.includes('AC Level 2')) return new THREE.BoxGeometry(0.6,1.3,0.4);
  if(kind.includes('HPC')||kind.includes('ultra')) return new THREE.CylinderGeometry(0.42,0.5,2.2,16);
  if(kind.includes('Buffered')) return new THREE.BoxGeometry(0.8,1.8,0.8);
  if(kind.includes('V2G')) return new THREE.CylinderGeometry(0.38,0.42,1.7,6);
  return new THREE.CylinderGeometry(0.36,0.42,1.8,12); // DC fast
}

function node(name,geo,color,pos,focus){
  const group=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.28,roughness:0.35,metalness:0.35});
  const mesh=new THREE.Mesh(geo,mat); group.add(mesh);
  const lbl=sprite(name.replace('charger_','C').replace('hub_tx','GRID').replace('backend','CSMS'));
  lbl.position.set(0,(geo.parameters.height||1.4)/2+0.7,0); group.add(lbl);
  group.position.copy(pos); scene3d.add(group);
  nodes[name]={group,mesh,mat,pos:pos.clone(),focus:focus||9,base:color};
  return nodes[name];
}
function tube(a,b,color=0x243247){
  const g=new THREE.TubeGeometry(new THREE.LineCurve3(a.clone(),b.clone()),1,0.035,8,false);
  const t=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.35}));
  scene3d.add(t); tubes.push(t); return {a:a.clone(),b:b.clone()};
}

function clearScene(){
  Object.values(nodes).forEach(n=>scene3d.remove(n.group));
  tubes.forEach(t=>scene3d.remove(t)); pulses.forEach(p=>scene3d.remove(p.mesh)); glows.forEach(g=>scene3d.remove(g.sp));
  (cur&&cur._decor||[]).forEach(d=>scene3d.remove(d));
  nodes={};tubes=[];pulses=[];glows=[];
}

function buildScene(s){
  clearScene(); s._decor=[];
  const cns=s.chargers, n=cns.length;
  node('backend',new THREE.BoxGeometry(1,1.7,0.8),0x8a7a55,new THREE.Vector3(-8,0,0),11);
  const hub=node('hub_tx',new THREE.BoxGeometry(1.5,1.5,1.5),0x9a865a,new THREE.Vector3(0,0,0),12);
  tube(nodes['backend'].pos,nodes['hub_tx'].pos,0x5a4826);
  // grid-type decoration around the hub
  decorateGrid(s.grid_type,s);
  // chargers on an arc to the right
  const R=Math.max(4,n*0.42);
  cns.forEach((cn,i)=>{
    const ang=n===1?0:(i/(n-1)-0.5)*Math.PI*(n>10?1.4:0.95);
    const pos=new THREE.Vector3(Math.cos(ang)*R+5, 0, Math.sin(ang)*R);
    const g=node(cn,chargerGeo(s.charger_type),0xbdae84,pos,8);
    tube(nodes['hub_tx'].pos,pos,0x4a3a1c);
    addGlow(pos,0x3b82f6,0.01); // heat halo, grows with temp
  });
  s._overview=Math.max(15,10+n*0.5); orb.r=s._overview; orb.tr=s._overview;
  orb.tgt.set(0,.3,0); orb.pivot.set(0,.3,0); selected=null;
  // badges
  $('#badges').innerHTML =
    `<span class="badge"><b>${s.charger_type}</b> charger</span>`+
    `<span class="badge"><b>${s.grid_type}</b></span>`+
    `<span class="badge">${n}×</span>`;
}

function decorateGrid(kind,s){
  const mk=(m)=>{scene3d.add(m);s._decor.push(m);return m;};
  if(kind.includes('Islanded')||kind.includes('BESS')){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.05,8,48),
      new THREE.MeshStandardMaterial({color:0xffb000,emissive:0xffb000,emissiveIntensity:0.6}));
    ring.rotation.x=Math.PI/2; ring.position.y=-1.5; mk(ring); s._ring=ring;
  }
  if(kind.includes('BESS')){
    const b=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.9,0.7),
      new THREE.MeshStandardMaterial({color:0x22c55e,emissive:0x16351f,emissiveIntensity:0.5}));
    b.position.set(0,0,-2.2); mk(b); mk((()=>{const l=sprite('BESS',1.6);l.position.set(0,1.1,-2.2);return l;})());
  }
  if(kind.includes('LV distribution')){
    const pv=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.0),
      new THREE.MeshStandardMaterial({color:0x1e3a8a,emissive:0x1e3a8a,emissiveIntensity:0.4,side:THREE.DoubleSide}));
    pv.rotation.x=-Math.PI/3; pv.position.set(0,0.2,-2.4); mk(pv); mk((()=>{const l=sprite('PV',1.3);l.position.set(0,1.1,-2.4);return l;})());
  }
}

// ---------- color ramp ----------
function heat(T){
  const x=Math.max(0,Math.min(1,(T-35)/(60-35))), c=new THREE.Color();
  if(x<0.5)c.lerpColors(new THREE.Color(0x3b82f6),new THREE.Color(0xf59e0b),x*2);
  else c.lerpColors(new THREE.Color(0xf59e0b),new THREE.Color(0xef4444),(x-0.5)*2);
  return c;
}

// ---------- pulses ----------
function srcOf(m){ return (m.node&&m.node.includes('backend'))?'backend':'hub_tx'; }
function spawnPulse(from,to){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,12),
    new THREE.MeshBasicMaterial({color:0xffb000}));
  const gl=addGlow(nodes[from].pos,0xffb000,1.4);
  scene3d.add(m); pulses.push({mesh:m,glow:gl,from:nodes[from].pos.clone(),to:nodes[to].pos.clone(),u:0});
}

// ---------- frame ----------
function applyFrame(){
  if(!cur)return; const fr=cur.timeline[tIdx]; if(!fr)return;
  cur.chargers.forEach((cn,i)=>{
    const st=fr.chargers[cn]; if(!st||!nodes[cn])return;
    const col=heat(st.temp); nodes[cn].mat.color.copy(col); nodes[cn].mat.emissive.copy(col);
    const hot=Math.max(0,(st.temp-40)/18); nodes[cn].mat.emissiveIntensity=0.28+0.9*hot;
    const gl=glows[i]; if(gl){gl.sp.material.color.copy(col); gl.sp.scale.setScalar(0.01+hot*2.6);}
    if(selected===cn) nodes[cn].mesh.scale.setScalar(1.12); else nodes[cn].mesh.scale.setScalar(1);
  });
  const hub=nodes['hub_tx'];
  if(hub){
    const over=Math.max(0,(fr.load-100)/80);
    const c=new THREE.Color(0x46607f).lerp(new THREE.Color(0xef4444),Math.min(1,over));
    hub.mat.color.copy(c); hub.mat.emissive.copy(c); hub.mat.emissiveIntensity=0.28+over*0.9;
  }
  if(cur._ring){ // frequency: ring brightness + color off-nominal
    const f=fr.freq; if(f!=null){ const dev=Math.min(1,Math.abs(f-50)/1.5);
      cur._ring.material.color.set(new THREE.Color(0xffb000).lerp(new THREE.Color(0xff3b30),dev));
      cur._ring.material.emissiveIntensity=0.5+dev; }
  }
  renderPanel(fr);
}

let lastT=-1;
function fireMarkers(t){ cur.markers.forEach(m=>{ if(m.t<=t&&m.t>lastT) spawnPulse(srcOf(m),cur.chargers[0]); }); lastT=t; }

// ---------- panel ----------
const tile=(k,v,u='',cls='')=>`<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}${u?` <small>${u}</small>`:''}</div></div>`;
const gaugeTile=(k,v,u,pct,cls='')=>`<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div><div class="gauge"><i style="width:${Math.max(2,Math.min(100,pct))}%"></i></div></div>`;
const row=(cls,t,m,flag)=>`<div class="row ${cls}"><span class="t">${t|0}s</span><span class="m">${m}</span><span class="flag ${flag}">${flag}</span></div>`;

function renderPanel(fr){
  const sc=cur.score, t=fr.t;
  let tiles=tile('Impact',sc.impact_score)+
    tile('Peak pack',sc.peak_pack_temp_C,'°C', sc.peak_pack_temp_C>=50?'hot':'')+
    gaugeTile('Transformer',sc.peak_transformer_load_pct,'%',sc.peak_transformer_load_pct, sc.peak_transformer_load_pct>100?'warn':'')+
    gaugeTile('Bus voltage',fr.volt==null?'—':fr.volt,'%',fr.volt==null?0:(fr.volt-80)*2.5, (fr.volt!=null&&(fr.volt<94||fr.volt>106))?'warn':'');
  if(sc.peak_coolant_temp_C!=null) tiles+=tile('Coolant',sc.peak_coolant_temp_C,'°C');
  if(fr.freq!=null) tiles+=gaugeTile('Frequency',fr.freq,'Hz',((fr.freq-48)/4)*100, (fr.freq<49.5||fr.freq>50.5)?'warn':'');
  if(fr.bess!=null) tiles+=gaugeTile('BESS SoC',fr.bess,'%',fr.bess);
  $('#tiles').innerHTML=tiles;

  const shown=cur.markers.filter(m=>m.t<=t).slice(-5).reverse();
  let rows=shown.map(m=>row(m.type,m.t,`${m.node} · ${m.label}`,m.type==='attack'?'illustrative':'modelled')).join('');
  const c0=fr.chargers[cur.chargers[0]];
  if(c0){
    const spoof=Math.abs(c0.reported-c0.temp)>1, vlow=fr.volt!=null&&(fr.volt<94||fr.volt>106);
    rows=row('physics',t,`${cur.chargers[0]} true ${c0.temp}°C @ ${c0.current}A`,'modelled')+
      (c0.coolant!=null?row('physics',t,`coolant ${c0.coolant}°C`,'modelled'):'')+
      (fr.volt!=null?row(vlow?'alert':'physics',t,`bus ${fr.volt}%${fr.freq!=null?` · ${fr.freq}Hz`:''} · load ${fr.load}%`,'modelled'):'')+
      (spoof?row('attack',t,`reported ${c0.reported}°C (spoofed)`,'illustrative'):'')+rows;
  }
  $('#trace').innerHTML=rows||'<div class="row"><span class="m">no events yet</span></div>';

  if(selected){
    const n=nodes[selected], st=fr.chargers[selected];
    $('#sel').hidden=false; $('#sel-n').textContent=selected;
    if(st) $('#sel-s').innerHTML=`true ${st.temp}°C · ${st.current}A${st.coolant!=null?` · coolant ${st.coolant}°C`:''}<br>reported ${st.reported}°C`;
    else if(selected==='hub_tx') $('#sel-s').innerHTML=`load ${fr.load}% · bus ${fr.volt}%${fr.freq!=null?`<br>freq ${fr.freq}Hz${fr.bess!=null?` · SoC ${fr.bess}%`:''}`:''}`;
    else $('#sel-s').textContent='backend / CSMS link';
  }
}

// ---------- transport ----------
function loadScene(i){ cur=SCENES[i]; tIdx=0; lastT=-1; $('#range').max=cur.timeline.length-1; buildScene(cur); applyFrame(); updateClock(); }
function updateClock(){ $('#clock').textContent=Math.round(cur.timeline[tIdx].t)+'s'; }
function setPlay(p){ playing=p; $('#play').textContent=p?'❚❚':'▶'; }
$('#play').onclick=()=>setPlay(!playing);
$('#reset').onclick=resetView;
$('#back').onclick=()=>{setPlay(false);tIdx=Math.max(0,tIdx-1);$('#range').value=tIdx;lastT=cur.timeline[tIdx].t;applyFrame();updateClock();};
$('#fwd').onclick =()=>{setPlay(false);tIdx=Math.min(cur.timeline.length-1,tIdx+1);$('#range').value=tIdx;fireMarkers(cur.timeline[tIdx].t);applyFrame();updateClock();};
$('#speed').onclick=()=>{spdI=(spdI+1)%SPEEDS.length;$('#speed').textContent=SPEEDS[spdI]+'×';};
$('#range').oninput=e=>{setPlay(false);tIdx=+e.target.value;lastT=cur.timeline[tIdx].t;applyFrame();updateClock();};

let last=performance.now(),acc=0;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),dt=(now-last)/1000; last=now;
  updateCam(dt);
  if(cur){
    if(playing){ acc+=dt*SPEEDS[spdI];
      if(acc>0.06){ acc=0; tIdx=Math.min(tIdx+1,cur.timeline.length-1); $('#range').value=tIdx; updateClock();
        if(tIdx>=cur.timeline.length-1) setPlay(false);
        fireMarkers(cur.timeline[tIdx].t); applyFrame(); }
    }
    for(let i=pulses.length-1;i>=0;i--){ const p=pulses[i]; p.u+=dt*0.8;
      if(p.u>=1){ scene3d.remove(p.mesh); scene3d.remove(p.glow.sp); glows=glows.filter(g=>g!==p.glow); pulses.splice(i,1); continue; }
      p.mesh.position.lerpVectors(p.from,p.to,p.u); p.glow.sp.position.copy(p.mesh.position);
      p.mesh.material.color.setHSL(0.09,1,0.5+0.2*Math.sin(p.u*10)); }
  }
  renderer.render(scene3d,cam);
}
boot();
</script>
